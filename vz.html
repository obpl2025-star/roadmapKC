<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Роадмап стажировки: направление ВЗ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--ink:#14263a;--mut:#5b6b7b;--card:#fff;--line:#b9c4cf;--pan:#fff;
--c1:#0e8a7d;--c2:#2f6fdb;--c3:#7a4fd6;--c4:#d9822b;--c5:#cf3f4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1822;--ink:#e8eef4;--mut:#93a3b3;--card:#182533;--line:#3a4b5c;--pan:#1a2a3a}}
:root[data-theme="dark"]{--bg:#0f1822;--ink:#e8eef4;--mut:#93a3b3;--card:#182533;--line:#3a4b5c;--pan:#1a2a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:28px 24px 8px;max-width:1500px;margin:0 auto}
h1{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--mut);max-width:60ch}
.bar{display:flex;align-items:center;gap:12px;margin-top:16px;max-width:420px}
.track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--c1);transition:width .3s}
.bar span{font-size:13px;color:var(--mut);white-space:nowrap}
.board{display:flex;padding:20px 24px 60px;max-width:1500px;margin:0 auto;overflow-x:auto;align-items:flex-start}
.day{flex:0 0 250px;position:relative;padding-right:34px}
.day:not(:last-child):after{content:"";position:absolute;top:26px;right:4px;width:30px;border-top:2px dashed var(--line)}
.day:not(:last-child):before{content:"";position:absolute;top:20px;right:2px;border:6px solid transparent;border-left:8px solid var(--line);border-right:0}
.dh{background:var(--a);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:16px}
.dh small{display:block;font-weight:500;opacity:.9;font-size:12px}
.flow{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding-top:18px}
.flow li:before{content:"";position:absolute;left:24px;top:0;height:18px;border-left:2px solid var(--line)}
.flow li:after{content:"";position:absolute;left:19px;top:11px;border:5px solid transparent;border-top:7px solid var(--line);border-bottom:0}
.b{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--a);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.b:hover{border-color:var(--a)}
.b:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.b.on{background:var(--a);color:#fff;border-color:var(--a)}
.b.done .t:after{content:" ✓";color:var(--a);font-weight:700}
.b.on.done .t:after{color:#fff}
.t{font-weight:500;font-size:14px;line-height:1.35}
#ov{position:fixed;inset:0;background:rgba(10,20,30,.4);display:none;z-index:5}
#ov.show{display:block}
#p{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--pan);color:var(--ink);z-index:6;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(105%);transition:transform .25s;box-shadow:-8px 0 30px rgba(0,0,0,.2);border-top:6px solid var(--a)}
#p.show{transform:none}
#p .dn{font-size:13px;color:var(--a);font-weight:600}
#p h2{margin:4px 0 12px;font-size:22px;line-height:1.25}
#p p{margin:0 0 12px;max-width:60ch}
#p ul{margin:0 0 14px;padding-left:20px}
#p li{margin-bottom:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btns button{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--a);background:var(--a);color:#fff}
.btns button.g{background:transparent;color:var(--ink);border-color:var(--line)}
.btns button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:760px){.board{flex-direction:column;overflow:visible;padding:16px}.day{flex:none;width:100%;padding:0 0 26px}
.day:not(:last-child):after{top:auto;bottom:4px;right:auto;left:24px;width:0;height:20px;border-top:0;border-left:2px dashed var(--line)}
.day:not(:last-child):before{top:auto;bottom:0;right:auto;left:18px;border:7px solid transparent;border-top:8px solid var(--line);border-bottom:0}
h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){#p,.fill{transition:none}}
</style>
</head>
<body>
<header>
<h1>Роадмап стажировки: направление ВЗ</h1>
<p>Пять дней, с понедельника по пятницу, с 9:00 до 17:00. Нажмите на блок, чтобы прочитать краткое описание. Отмечайте изученное.</p>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><span id="cnt"></span></div>
</header>
<main class="board" id="board"></main>
<div id="ov"></div>
<aside id="p" role="dialog" aria-modal="true" aria-labelledby="pt"></aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script>
var D=[
{n:"День 1",s:"Знакомство и база",c:"--c1",b:[
["Знакомство и план стажировки","Стажировка идёт с понедельника по пятницу, с 9:00 до 17:00. В пятницу — финальное тестирование из 30 вопросов. Также проходит встреча с руководителем по заработной плате."],
["Сайт и личный кабинет","Схема регистрации: паспортные данные, адрес, фото паспорта, способ получения. Навигация в ЛК: Мои кошельки, Мои займы, DigiБонус, Приведи друга."],
["Юридическая информация","Номер ГЛ: 8 800 700 6595. Юр. адрес: 123112, г. Москва, Пресненская наб., д. 2, помещ. 54п/2. Директор — Степанова Нина Валерьевна."],
["Криптовалюта и USDT","USDT — цифровой аналог доллара США, приравнивается к его курсу. P2P — сервис обмена USDT на RUB и обратно. Сеть отправки — способ передачи криптовалюты; компания использует TRC20."],
["Криптокошельки и Тронскан","Криптокошелёк — ячейка хранения криптовалюты. Горячий — привязан и верифицирован биржей. Холодный — устройство для хранения. Тронскан — сервис проверки хеша транзакций."],
["Способы обмена и оплаты","Обмен USDT в RUB: Мои кошельки → «Вывести на карту» → номер карты, ФИО получателя, банк.",["Оплата займа: Мои займы → «Оплатить»","Картой: ввести сумму, перевести в своём банке по реквизитам с сайта","Криптокошельком: ввести сумму, перевести на кошелёк с сайта по сети USDT TRC20"]],
["Критерии получения займа","Паспорт и гражданство РФ, возраст от 18 до 55 лет."],
["Слова-табу","Заменяем слова при общении с клиентом:",["кредит → займ","сумма → количество, долг","в рублях → в эквиваленте рубля","деньги → активы, средства"]],
["DigiБонус и «Приведи друга»","DigiБонус: при своевременном закрытии займа клиент получает обратно до 5% от оплаченного (кешбек). «Приведи друга»: клиент получает 50 USDT, если приглашённый по реферальной ссылке друг подал заявку и вовремя закрыл займ."],
["Изучение договора","Просмотр актуального договора займа."],
["Тарифы и промокоды","Тариф — условия займа: проценты, максимальная сумма, максимальный срок подачи заявки, доступность. Промокод — скидка на проценты. Пример: 100 USDT → с промо NEW75 — 25 USDT."],
["Чек-лист КЛ","Макет диалога с клиентом."],
["Внесение в ЧС","Клиента вносим в чёрный список по причинам:",["просьба клиента","оплата третьим лицом","клиент погиб"]],
["Чек-лист «3 лица»","Макет диалога с третьими лицами."]
]},
{n:"День 2",s:"Алгоритмы и Софт+",c:"--c2",b:[
["Общие алгоритмы","Общий регламент взаимодействия. Основные алгоритмы:",["Перезвон; структура ведения чата с клиентами и 3 лицами","Работа с 3 лицами, готовыми оплатить займ; оплата через 3 лицо","Работа в соцсетях и мессенджерах; приоритетность мессенджеров","Мотиватор «Перезаймы»","Реструктуризация (РР) и реклама РР","Последовательность списания; списание во время звонка и переписки","Входящие обращения клиентов","Отработка нарушенного обещания","Сделка «с котла»","Шаблонное СМС по ДЛ и 3 лицам через Инари; отработка входящего звонка","Обращение на вход при отсутствии сотрудника на смене, но с договорённостью об оплате","Отработка ТК","Временная блокировка обращений на ГЛ (24 часа)"]],
["Алгоритмы Софт+","Регламент для просрочки от 21 до 45 дней. Общие условия:",["Обращение к клиенту и 3 лицу по имени","Общение только на «Вы» по белым каналам","Коммуникации с 7:00 до 23:59 по времени клиента","При сбросе — звонки в неограниченном количестве","Интервала между белыми и серыми каналами нет"]],
["Алгоритмы белой","Регламент общения через белый канал. С 21-го дня разрешены коллажи с надписями «Внимание должник», «Розыск должника», названием компании, суммой долга, номером ГЛ, ВЦ и другими каналами связи. Pixly и Grok AI (розыск с паспортом) — только по белым каналам."],
["Критические ошибки","Считаются критическими:",["Грубая лексика, маты, обзывательства по белой телефонии","Разговоры на политическую или военную тематику","Отправка неэтичных фото","Оформление кредитов на посторонних лиц","Работа с детьми младше 18 лет","Продажа органов","Некорректная фиксация ЦД","Нарушение утверждённого алгоритма, алгоритма работы с 3 лицом, с серой и белой телефонией","Звонки-фроды","Действия по займу в CRM без ведома клиента"]],
["Мотивации Софт+","Инструменты стимулирования погашения. Применяются строго по дню просрочки и утверждённым алгоритмам: деловая репутация, суд, исполнитель, продажа долга в коллекторское агентство."],
["Работа с возражениями","Руководство по эффективной отработке возражений при взыскании задолженности."],
["Мотивация 3 лиц Софт+","В работу включаем только тех 3 лиц, чьи степени родства разрешены на проекте. Зависит от дня просрочки и имени контакта в телефонной книге."],
["Шаблоны белых коллажей","Макеты коллажей для работы через белый канал."],
["Лояльные условия","Гибкие инструменты урегулирования с учётом возможностей клиента:",["оформление реструктуризации","остановка начислений","списание"]],
["Работа на входящей линии","Всегда проводим верификацию: ФИО и дата рождения. Если звонит 3 лицо:",["Назвать своё имя и компанию, спросить «Чем могу помочь?»","Идентифицировать: ФИО клиента и ФИО 3 лица","При отказе назвать данные — сообщить, что данные по займу даются только после верификации"]]
]},
{n:"День 3",s:"Серая, инструменты",c:"--c3",b:[
["Алгоритмы серой","Регламент общения через серый канал: фото из соцсетей, серые коллажи, отработка нарушенного обещания с использованием нейросетей. Точные допустимые приёмы смотрите в утверждённом регламенте."],
["Юридическая база","Основные статьи для отработки возражений."],
["Инари","Внутренняя CRM-система компании."],
["Работа с мессенджерами","Ведётся в эмуляторах LD и Dolphin Anty."]
]},
{n:"День 4",s:"Обучение и практика",c:"--c4",b:[
["Отдел обучения","Руководитель — Сафонов Олег. Тренер стажировки — Руслан Зубов. Тренер Софт — Таран Максим. Тренер Софт+ — Панасенко Денис. Тренер Хард — Филатов Роман."],
["Поисковые системы и практика","Подключение поисковых систем для работы согласно алгоритмам."]
]},
{n:"День 5",s:"Тест и доступы",c:"--c5",b:[
["Финальное тестирование","Проходит на 5-й день стажировки."],
["Оптимизация доступов","Настройка всех доступов, мессенджеров, запрос сделок на пробитие."],
["Подключение в Рокет чат","Подключение в рабочий чат."]
]}
];
var sel=null,done={},total=0,last=null;
var ROADMAP="vz";try{done=JSON.parse(localStorage.getItem("vz_done")||"{}")}catch(e){}
if(window.Sync)Sync.load(ROADMAP).then(function(m){if(m){done=m;upd()}});
var board=document.getElementById("board"),P=document.getElementById("p"),OV=document.getElementById("ov");
function esc(s){return s.replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
D.forEach(function(d,i){
 var col=document.createElement("section");col.className="day";col.style.setProperty("--a","var("+d.c+")");
 var h='<div class="dh">'+d.n+'<small>'+d.s+'</small></div><ol class="flow">';
 d.b.forEach(function(b,j){total++;var id=i+"-"+j;
  h+='<li><button class="b" data-id="'+id+'"><span class="t">'+esc(b[0])+'</span></button></li>'});
 col.innerHTML=h+'</ol>';board.appendChild(col)});
function find(id){var a=id.split("-");return{d:D[a[0]],b:D[a[0]].b[a[1]]}}
function upd(){
 var n=0;document.querySelectorAll(".b").forEach(function(el){var k=el.dataset.id;el.classList.toggle("done",!!done[k]);if(done[k])n++;el.classList.toggle("on",k===sel)});
 document.getElementById("fill").style.width=(n/total*100)+"%";
 document.getElementById("cnt").textContent="Изучено "+n+" из "+total}
function open(id,el){
 sel=id;last=el;var r=find(id),b=r.b;
 P.style.setProperty("--a","var("+r.d.c+")");
 var h='<div class="dn">'+r.d.n+' · '+r.d.s+'</div><h2 id="pt">'+esc(b[0])+'</h2>';
 if(b[1])h+='<p>'+esc(b[1])+'</p>';
 if(b[2])h+='<ul>'+b[2].map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul>';
 h+='<div class="btns"><button id="dn">'+(done[id]?"Снять отметку":"Отметить изученным")+'</button><button class="g" id="cl">Закрыть</button></div>';
 P.innerHTML=h;P.classList.add("show");OV.classList.add("show");upd();
 document.getElementById("cl").onclick=close;
 document.getElementById("dn").onclick=function(){
  if(done[id])delete done[id];else done[id]=1;
  try{localStorage.setItem("vz_done",JSON.stringify(done))}catch(e){}
  if(window.Sync)Sync.save(ROADMAP,id,!!done[id]);
  open(id,last)};
 document.getElementById("cl").focus()}
function close(){sel=null;P.classList.remove("show");OV.classList.remove("show");upd();if(last)last.focus()}
board.addEventListener("click",function(e){var el=e.target.closest(".b");if(el)open(el.dataset.id,el)});
OV.onclick=close;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sel)close()});
upd();
</script>
</body>
</html>
